# Free/local-only deployment: no paid services involved.
#
# Usage:
#   docker compose up --build
#   Backend:  http://localhost:8000  (health check: /health)
#   Frontend: http://localhost:8080
#
# The frontend container just serves the static index.html via nginx;
# it still talks to the backend directly from the browser at the API_BASE
# configured inside frontend/index.html (default http://localhost:8000).

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data:ro
      - ./backend/app/models/weights:/app/app/models/weights:ro
    environment:
      - MEDVERIFY_CORS_ORIGINS=*
      - MEDVERIFY_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped
    depends_on:
      - backend
